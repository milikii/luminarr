services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: luminarr-test-transmission
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      - TRANSMISSION_RPC_AUTHENTICATION_REQUIRED=false
      - TRANSMISSION_RPC_WHITELIST_ENABLED=false
      - TRANSMISSION_WEB_HOME=/config/webui/trguing-zh
    volumes:
      - ${LUMINARR_TEST_ROOT:-/home/alex/luminarr-test}/config/transmission:/config
      - /data/downloads/tr:/downloads/complete
      - /data/downloads/incomplete:/downloads/incomplete
      - /data/downloads/watch:/watch
    ports:
      - "19091:9091"
      - "15141:51413"
      - "15141:51413/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl -si http://127.0.0.1:9091/transmission/rpc | grep -q X-Transmission-Session-Id"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  transmission-bt:
    image: lscr.io/linuxserver/transmission:latest
    container_name: luminarr-test-transmission-bt
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      - TRANSMISSION_RPC_AUTHENTICATION_REQUIRED=false
      - TRANSMISSION_RPC_WHITELIST_ENABLED=false
      - TRANSMISSION_WEB_HOME=/config/webui/trguing-zh
    volumes:
      - ${LUMINARR_TEST_ROOT:-/home/alex/luminarr-test}/config/transmission-bt-stack:/config
      - ${LUMINARR_TEST_ROOT:-/home/alex/luminarr-test}/config/transmission/webui/trguing-zh:/config/webui/trguing-zh:ro
      - /data/downloads/tr-bt:/downloads/complete
      - /data/downloads/incomplete-bt:/downloads/incomplete
      - /data/downloads/watch-bt:/watch
    ports:
      - "19092:9091"
      - "15142:51413"
      - "15142:51413/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl -si http://127.0.0.1:9091/transmission/rpc | grep -q X-Transmission-Session-Id"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: luminarr-test-qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /home/alex/projects/luminarr/docker/test/qbittorrent:/config
      - /data/downloads/qb:/data/downloads/qb
      - /data/downloads/incomplete-qb:/data/downloads/incomplete-qb
    ports:
      - "18098:8080"
      - "15143:6881"
      - "15143:6881/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  emby:
    image: lscr.io/linuxserver/emby:latest
    container_name: luminarr-test-emby
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ${LUMINARR_TEST_ROOT:-/home/alex/luminarr-test}/config/emby:/config
      - /data/library:/data/library
    ports:
      - "18096:8096"
      - "18920:8920"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/System/Info/Public | grep -q ServerName"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
